<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arranque en frío</title>
  <style>
    body {
      margin: 0;
      background: #080d15;
      color: white;
      font: 16px system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }

    #mensaje {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas width="1280" height="719" aria-label="Auto rojo bajo la nieve"></canvas>
  <p id="mensaje">Cargando foto…</p>

  <script>
    const lienzo = document.querySelector("canvas");
    const ctx = lienzo.getContext("2d");
    const mensaje = document.querySelector("#mensaje");
    const { width: ancho, height: alto } = lienzo;
    const foto = new Image();

    const fps = 30;
    const cantidadCopos = 150;
    const duracionCiclo = 15;
    const vuelta = Math.PI * 2;
    const intervalo = 1000 / fps;

    const azar = (min, max) => min + Math.random() * (max - min);
    const envolver = (valor, limite) =>
      ((valor % limite) + limite) % limite;

    const copos = Array.from({ length: cantidadCopos }, (_, i) => {
      const cercano = i >= Math.floor(cantidadCopos * 0.7);

      return {
        x: azar(0, ancho + 40),
        y: azar(0, alto + 24),
        radio: cercano ? azar(1.3, 2.7) : azar(0.5, 1.3),
        velocidad: cercano ? azar(59, 105) : azar(23, 50),
        fase: azar(0, vuelta),
        opacidad: cercano ? azar(0.27, 0.55) : azar(0.15, 0.33),
        deriva: cercano ? azar(9, 22) : azar(4, 12)
      };
    });

    const nieveDelSuelo = Array.from({ length: 28 }, () => ({
      x: azar(160, 1060),
      y: azar(645, 698),
      rapidez: azar(65, 155),
      largo: azar(2, 8)
    }));

    function resplandor(x, y, radioX, radioY, color, intensidad, giro = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(giro);
      ctx.scale(radioX, radioY);

      const degradado = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      degradado.addColorStop(0, `rgba(${color},${intensidad})`);
      degradado.addColorStop(1, `rgba(${color},0)`);
      ctx.fillStyle = degradado;
      ctx.fillRect(-1, -1, 2, 2);
      ctx.restore();
    }

    function pulso(tiempo, centro, amplitud) {
      return Math.exp(-Math.pow((tiempo - centro) / amplitud, 2));
    }

    function luzSobreCopo(x, y, faroX) {
      const distancia = (y - 490) / 180;
      if (distancia < 0 || distancia > 1) return 0;

      const centro = faroX + (faroX - 620) * distancia * 0.23;
      const anchoHaz = 24 + distancia * 95;
      const borde = Math.max(0, 1 - Math.abs(x - centro) / anchoHaz);
      return borde * (1 - distancia);
    }

    function dibujarEscena(ciclo, transcurrido) {
      ctx.drawImage(foto, 0, 0, ancho, alto);
      ctx.globalCompositeOperation = "screen";

      // Los faros se intensifican y su brillo llega al pavimento.
      const lucesAltas = pulso(ciclo, 6.4, 0.55);
      const intensidad = 0.12 + lucesAltas * 0.48;
      resplandor(427, 514, 58, 37, "255,237,211", intensidad);
      resplandor(811, 514, 58, 37, "255,237,211", intensidad);
      resplandor(392, 668, 110, 25, "255,207,146", intensidad * 0.36, -0.18);
      resplandor(847, 668, 110, 25, "255,207,146", intensidad * 0.36, 0.18);

      // El reflejo dorado baja del parabrisas al cofre.
      const avance = Math.min(1, Math.max(0, (ciclo - 8) / 4.5));
      const fuerza = Math.sin(avance * Math.PI) * 0.23;
      resplandor(
        676 + avance * 54, 404 + avance * 100,
        72, 17, "255,184,99", fuerza, 0.28
      );

      // Los copos usan el tiempo total para seguir cayendo entre ciclos.
      for (const copo of copos) {
        const x = envolver(
          copo.x + Math.sin(transcurrido * 1.1 + copo.fase) * copo.deriva +
            transcurrido * 16,
          ancho + 40
        ) - 20;
        const y = envolver(
          copo.y + transcurrido * copo.velocidad,
          alto + 24
        ) - 12;

        const haz = Math.max(luzSobreCopo(x, y, 427), luzSobreCopo(x, y, 811));
        const brillo = Math.min(1, copo.opacidad + haz * (0.25 + lucesAltas * 0.48));

        ctx.fillStyle = haz > 0.15
          ? `rgba(255,239,210,${brillo})`
          : `rgba(220,235,255,${brillo})`;
        ctx.beginPath();
        ctx.arc(x, y, copo.radio, 0, vuelta);
        ctx.fill();
      }

      // Una ráfaga de nieve cruza frente al auto.
      const rafaga = pulso(ciclo, 11.6, 0.85);
      ctx.fillStyle = `rgba(217,234,255,${rafaga * 0.25})`;
      for (const grano of nieveDelSuelo) {
        const x = envolver(grano.x + transcurrido * grano.rapidez, ancho);
        ctx.fillRect(x, grano.y, grano.largo, 1);
      }

      ctx.globalCompositeOperation = "source-over";
    }

    let inicio;
    let ultimoCuadro = -1;

    function animar(ahora) {
      inicio ??= ahora;
      const milisegundos = ahora - inicio;
      const cuadro = Math.floor(milisegundos / intervalo);

      if (cuadro !== ultimoCuadro) {
        const transcurrido = milisegundos / 1000;
        dibujarEscena(transcurrido % duracionCiclo, transcurrido);
        ultimoCuadro = cuadro;
      }

      requestAnimationFrame(animar);
    }

    foto.onload = () => {
      mensaje.remove();
      dibujarEscena(0, 0);
      requestAnimationFrame(animar);
    };

    foto.onerror = () => {
      mensaje.textContent = "Pon 1793909611159.jpg junto a index.html.";
    };

    foto.src = "./1793909611159.jpg";
  </script>
</body>
</html>
